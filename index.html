<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hospitality Management Flashcards</title>
  <style>
    :root{
      --brand:#0661aa;
      --bg:#f5f7fb;
      --card-bg:#ffffff;
      --text:#1c2530;
      --muted:#5b6b7a;
      --shadow: 0 10px 24px rgba(12, 24, 47, 0.12);
      --radius:16px;
      --radius-sm:12px;
      --focus:#0d7fe8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
      background: linear-gradient(180deg, #f7f9fc 0%, #eef3f9 100%);
      color:var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header */
    header{
      background:var(--brand);
      color:#fff;
      padding:18px 20px;
      box-shadow: 0 4px 18px rgba(6,97,170,0.25);
      position: sticky;
      top:0;
      z-index: 5;
    }
    .wrap{
      max-width: 980px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .title{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:700;
      letter-spacing:0.2px;
    }
    .title .logo{
      width:28px; height:28px;
      display:inline-flex; align-items:center; justify-content:center;
      border:2px solid rgba(255,255,255,0.9);
      border-radius:10px;
      font-size:14px; font-weight:800;
      color:#fff;
    }
    .subtitle{
      opacity:0.9;
      font-size:14px;
    }

    /* Main layout */
    main{
      max-width: 980px;
      margin: 28px auto 40px;
      padding: 0 16px;
    }
    .board{
      display:grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items:center;
      justify-items:center;
    }

    /* Card area */
    .stage{
      width: min(680px, 100%);
      perspective: 1200px;
    }
    .card{
      position: relative;
      width: 100%;
      min-height: clamp(280px, 48vw, 360px);
      border-radius: var(--radius);
      transform-style: preserve-3d;
      transition: transform 640ms cubic-bezier(.2,.8,.2,1), box-shadow 240ms ease;
      box-shadow: var(--shadow);
      cursor: pointer;
      user-select: none;
      background: transparent;
      outline: none;
    }
    .card:focus-visible{
      box-shadow: 0 0 0 4px rgba(13,127,232,0.28), var(--shadow);
    }
    .card.flipped{
      transform: rotateY(180deg);
    }

    .face{
      position:absolute;
      inset:0;
      border-radius: var(--radius);
      background: var(--card-bg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display:flex;
      flex-direction: column;
      justify-content: center;
      padding: 26px;
    }
    .face.back{
      transform: rotateY(180deg);
    }
    .badge{
      align-self:flex-start;
      background: #eaf4ff;
      color: #0a5fb9;
      border:1px solid #d3e9ff;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .3px;
      text-transform:uppercase;
      margin-bottom: 12px;
    }
    .front h2, .back h2{
      margin: 6px 0 8px;
      font-size: clamp(20px, 2.8vw, 28px);
      line-height: 1.2;
    }
    .content{
      font-size: clamp(15px, 2.2vw, 17px);
      color: var(--muted);
      line-height: 1.6;
    }
    .hint{
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 12px;
      color: #6b7b8b;
      opacity: 0.9;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(0,0,0,0.06);
      padding: 6px 10px;
      border-radius: 10px;
      backdrop-filter: blur(6px);
    }

    /* Controls */
    .controls{
      width: min(680px, 100%);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .left, .right{
      display:flex; align-items:center; gap:10px;
    }
    .counter{
      font-weight:700;
      color:#243140;
      background:#fff;
      border:1px solid #e9eef5;
      padding:8px 12px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(10,23,55,0.06);
    }

    button.nav{
      appearance: none;
      border: 1px solid #d8e4f3;
      color: #0c2a47;
      background: #ffffff;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(12,24,47,0.08);
      transition: transform 120ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }
    button.nav:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(12,24,47,0.12);
      border-color:#cfe0f5;
    }
    button.nav:active{
      transform: translateY(0);
      box-shadow: 0 6px 14px rgba(12,24,47,0.10);
    }
    button.nav:disabled{
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .primary{
      background: var(--brand);
      color:#fff;
      border-color: #03579a;
    }
    .primary:hover{
      border-color:#024b86;
    }

    /* Footer note */
    .note{
      text-align:center;
      color:#5d6d7c;
      font-size: 13px;
      margin-top: 10px;
    }

    @media (max-width: 520px){
      .subtitle{ display:none; }
      .hint{ display:none; }
      .controls{ flex-direction: column; align-items: stretch; }
      .left, .right{ justify-content: space-between; }
    }
  </style>
</head>
<body>
  <header role="banner">
    <div class="wrap" aria-label="Header">
      <div class="title" aria-label="App title">
        <div class="logo" aria-hidden="true">HC</div>
        <div>
          <div>Hospitality Management Flashcards</div>
          <div class="subtitle">Click the card to flip · Use Previous/Next or ← → keys</div>
        </div>
      </div>
      <div class="counter" id="counter" aria-live="polite">Card 1 of 10</div>
    </div>
  </header>

  <main role="main">
    <section class="board" aria-label="Flashcard Board">
      <!-- Card Stage -->
      <div class="stage">
        <div id="card" class="card" role="button" tabindex="0" aria-pressed="false" aria-label="Flashcard. Click or press Enter/Space to flip.">
          <article class="face front" aria-hidden="false">
            <span class="badge">Front</span>
            <h2 id="front-title">Loading…</h2>
            <p class="content" id="front-body"></p>
            <div class="hint" aria-hidden="true">Click to flip</div>
          </article>
          <article class="face back" aria-hidden="true">
            <span class="badge">Back</span>
            <h2 id="back-title">Loading…</h2>
            <p class="content" id="back-body"></p>
            <div class="hint" aria-hidden="true">Click to flip back</div>
          </article>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls" aria-label="Navigation controls">
        <div class="left">
          <button class="nav" id="prevBtn" type="button" aria-label="Previous card">
            ◀ Previous
          </button>
          <button class="nav primary" id="nextBtn" type="button" aria-label="Next card">
            Next ▶
          </button>
        </div>
        <div class="right">
          <span class="note">Tip: Press <strong>Space</strong> to flip · Use <strong>←</strong>/<strong>→</strong> to navigate</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ---- Data: 10 Hospitality Management Flashcards ----
    const CARDS = [
      {
        frontTitle: "RevPAR",
        frontBody: "What is Revenue per Available Room (RevPAR)?",
        backTitle: "RevPAR (Revenue per Available Room)",
        backBody: "Measures room revenue performance. Formula: RevPAR = Room Revenue ÷ Available Rooms, or ADR × Occupancy Rate."
      },
      {
        frontTitle: "ADR",
        frontBody: "Define Average Daily Rate (ADR).",
        backTitle: "ADR (Average Daily Rate)",
        backBody: "The average price paid per occupied room. Formula: ADR = Room Revenue ÷ Number of Rooms Sold."
      },
      {
        frontTitle: "Occupancy Rate",
        frontBody: "How do you calculate Occupancy Rate?",
        backTitle: "Occupancy Rate",
        backBody: "Indicates utilization of available rooms. Formula: Occupancy = Rooms Sold ÷ Rooms Available (usually as a %)."
      },
      {
        frontTitle: "Front Office vs. Back of House",
        frontBody: "What’s the difference between Front Office and Back of House?",
        backTitle: "Front Office vs. Back of House",
        backBody: "Front Office is guest-facing (check-in/out, reservations, concierge). Back of House supports operations (admin, accounting, engineering, housekeeping areas)."
      },
      {
        frontTitle: "Yield Management",
        frontBody: "Explain Yield Management in hospitality.",
        backTitle: "Yield Management",
        backBody: "Pricing and inventory control to sell the right room, to the right guest, at the right time, for the right price, to maximize revenue."
      },
      {
        frontTitle: "Guest Cycle",
        frontBody: "What are the main stages of the Guest Cycle?",
        backTitle: "Guest Cycle Stages",
        backBody: "Pre-arrival (marketing & reservations), Arrival (registration), Occupancy (service & upsell), Departure (settlement & feedback)."
      },
      {
        frontTitle: "Service Recovery",
        frontBody: "What is Service Recovery and a common approach?",
        backTitle: "Service Recovery",
        backBody: "Actions to resolve service failures and restore guest satisfaction. Example method: LISTEN, EMPATHIZE, APOLOGIZE, RESOLVE, THANK."
      },
      {
        frontTitle: "PMS",
        frontBody: "What is a Property Management System (PMS)?",
        backTitle: "Property Management System (PMS)",
        backBody: "Core software that manages reservations, check-in/out, room status, billing, reporting, and often integrates with POS and channel managers."
      },
      {
        frontTitle: "F&B Cost %",
        frontBody: "How is Food & Beverage Cost Percentage calculated?",
        backTitle: "Food & Beverage Cost Percentage",
        backBody: "F&B Cost % = (Cost of Goods Sold ÷ F&B Sales) × 100. Helps control menu pricing and margins."
      },
      {
        frontTitle: "Overbooking",
        frontBody: "Why do hotels overbook and how do they mitigate risks?",
        backTitle: "Overbooking Strategy",
        backBody: "To offset expected no-shows/cancellations and protect revenue. Mitigation: accurate forecasting, walk policies, partner re-accommodation, and clear communication."
      }
    ];

    // ---- State ----
    let index = 0;
    let flipped = false;

    // ---- Elements ----
    const cardEl = document.getElementById('card');
    const frontTitleEl = document.getElementById('front-title');
    const frontBodyEl = document.getElementById('front-body');
    const backTitleEl = document.getElementById('back-title');
    const backBodyEl = document.getElementById('back-body');
    const counterEl = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // ---- Renderers ----
    function renderCard() {
      const data = CARDS[index];
      frontTitleEl.textContent = data.frontTitle;
      frontBodyEl.textContent = data.frontBody || "";
      backTitleEl.textContent = data.backTitle;
      backBodyEl.textContent = data.backBody || "";
    }

    function renderCounter() {
      counterEl.textContent = `Card ${index + 1} of ${CARDS.length}`;
    }

    function setFlipped(isFlipped) {
      flipped = isFlipped;
      cardEl.classList.toggle('flipped', flipped);
      cardEl.setAttribute('aria-pressed', String(flipped));
      // Update aria-hidden for faces
      cardEl.querySelector('.front').setAttribute('aria-hidden', String(flipped));
      cardEl.querySelector('.back').setAttribute('aria-hidden', String(!flipped));
    }

    function updateButtons() {
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === CARDS.length - 1;
    }

    function go(delta) {
      const newIndex = index + delta;
      if (newIndex < 0 || newIndex >= CARDS.length) return;
      index = newIndex;
      setFlipped(false); // always reset to front on navigation
      renderCard();
      renderCounter();
      updateButtons();
      // Focus card for accessibility convenience
      cardEl.focus({ preventScroll: false });
    }

    // ---- Event Handlers ----
    cardEl.addEventListener('click', () => setFlipped(!flipped));
    cardEl.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        setFlipped(!flipped);
      } else if (e.key === 'ArrowRight') {
        go(1);
      } else if (e.key === 'ArrowLeft') {
        go(-1);
      }
    });

    prevBtn.addEventListener('click', () => go(-1));
    nextBtn.addEventListener('click', () => go(1));

    // Support global arrow key nav for convenience
    window.addEventListener('keydown', (e) => {
      if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)) return;
      if (e.key === 'ArrowRight') go(1);
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === ' ') { e.preventDefault(); setFlipped(!flipped); }
    });

    // ---- Init ----
    renderCard();
    renderCounter();
    updateButtons();
  </script>
</body>
</html>
