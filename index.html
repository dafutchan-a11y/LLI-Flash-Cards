<!-- Flashcards (inline, self-contained) -->
<div class="fcapp" id="fcapp-l2iltks3xml"></div>
<style>
  #fcapp-l2iltks3xml {
    --fc-primary: #0661aa;
    --fc-on-primary: #ffffff;
    --fc-accent1: #a9ca48;
    --fc-accent1-on: #0d1b1e;
    --fc-accent2: #EA7024;
    --fc-accent2-on: #ffffff;
    --fc-dark: #0d3b5d;
    --fc-border: #e5e7eb;
    --fc-shadow1: 0 8px 18px rgba(0,0,0,0.06);
    --fc-shadow2: 0 10px 28px rgba(0,0,0,0.12);
    color: #0e1726;
  }
  #fcapp-l2iltks3xml .fc-header { background: var(--fc-primary); color: var(--fc-on-primary); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; box-shadow: var(--fc-shadow1);}
  #fcapp-l2iltks3xml .fc-title { font-weight: 800; font-size: 18px; margin: 0; }
  #fcapp-l2iltks3xml .fc-subtle { opacity: .85; font-size: 13px; }
  #fcapp-l2iltks3xml .fc-card { perspective: 1200px; width: 100%; max-width: 760px; margin: 18px auto 10px; cursor: pointer; }
  #fcapp-l2iltks3xml .fc-card-inner { position:relative; width:100%; min-height:220px; transition:transform .65s cubic-bezier(0.22,1,0.36,1); transform-style:preserve-3d; border-radius:16px; box-shadow: var(--fc-shadow2); }
  #fcapp-l2iltks3xml .flipped .fc-card-inner { transform: rotateY(180deg); }
  #fcapp-l2iltks3xml .fc-card-face { position:absolute; inset:0; border-radius:16px; background: var(--fc-primary); color: var(--fc-on-primary); backface-visibility:hidden; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; font-size:20px; line-height:1.5; }
  #fcapp-l2iltks3xml .fc-back { transform: rotateY(180deg); }
  #fcapp-l2iltks3xml .fc-nav { display:flex; align-items:center; justify-content:center; gap:10px; margin:12px 0 6px; flex-wrap:wrap; }
  #fcapp-l2iltks3xml .fc-btn { appearance:none; border:none; border-radius:999px; padding:10px 16px; font-weight:800; font-size:14px; cursor:pointer; box-shadow: var(--fc-shadow1); transition: transform .05s ease, opacity .2s ease; }
  #fcapp-l2iltks3xml .fc-btn:active { transform: translateY(1px); }
  #fcapp-l2iltks3xml .fc-btn.primary   { background: var(--fc-accent2); color: var(--fc-accent2-on); }
  #fcapp-l2iltks3xml .fc-btn.secondary { background: var(--fc-accent1); color: var(--fc-accent1-on); }
  #fcapp-l2iltks3xml .fc-btn.ghost     { background: #fff; color: #0e1726; border: 1px solid var(--fc-border); }
  #fcapp-l2iltks3xml .fc-counter { font-size: 13px; color: #6b7a90; }
  #fcapp-l2iltks3xml .fc-review-row { display:flex; gap:10px; align-items:center; justify-content:center; margin-top:6px; flex-wrap:wrap; }
  #fcapp-l2iltks3xml .fc-progress { text-align:center; font-size:13px; color:#374151; margin-top:8px; }
  #fcapp-l2iltks3xml .fc-complete { max-width:760px; margin:18px auto; padding:22px; border-radius:14px; background:#fff; border:1px solid var(--fc-border); text-align:center; box-shadow: var(--fc-shadow1); }
  #fcapp-l2iltks3xml .fc-complete h3 { margin:0 0 10px; }
</style>
<script>(function(){
  const DATA = {"title":"Academics Team Trading Cards","mode":"practice","brand":{"primary":"#0661aa","onPrimary":"#ffffff","accent1":"#a9ca48","onAccent1":"#0d1b1e","accent2":"#EA7024","onAccent2":"#ffffff","dark":"#0d3b5d"},"cards":[{"front":"Genny","back":"Genny is awesome"},{"front":"Steven","back":"Steven is awesome"},{"front":"David","back":"He's meh"}]};
  const root = document.getElementById('fcapp-l2iltks3xml');
  const modeLabel = DATA.mode === 'review' ? 'Review Mode' : 'Practice Mode';
  function escapeHtml(str){return (str||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  function safeMultiline(text){return escapeHtml(text).replace(/\n/g,'<br>');}
  function build(){
    root.innerHTML='';
    const header=document.createElement('div'); header.className='fc-header'; header.innerHTML='<h2 class="fc-title">'+escapeHtml(DATA.title)+'</h2><div class="fc-subtle">'+modeLabel+'</div>'; root.appendChild(header);
    const complete=document.createElement('div'); complete.className='fc-complete'; complete.style.display='none'; complete.innerHTML='<h3>All set! 🎉</h3><p>You\u2019ve marked every card as <strong>Know it</strong>.</p><div class="fc-review-row"><button class="fc-btn secondary" data-restart>Restart</button></div>'; root.appendChild(complete);
    const card=document.createElement('div'); card.className='fc-card'; card.setAttribute('role','button'); card.setAttribute('tabindex','0'); card.setAttribute('aria-label','Flashcard. Click or press Enter to flip.'); card.innerHTML='<div class="fc-card-inner"><div class="fc-card-face fc-front"></div><div class="fc-card-face fc-back"></div></div>'; root.appendChild(card);
    const inner=card.querySelector('.fc-card-inner'); const frontEl=card.querySelector('.fc-front'); const backEl=card.querySelector('.fc-back');
    const nav=document.createElement('div'); nav.className='fc-nav'; nav.innerHTML='<button class="fc-btn ghost" data-prev>&larr; Previous</button><button class="fc-btn primary" data-next>Next &rarr;</button><div class="fc-counter" data-counter>Card 1 of '+DATA.cards.length+'</div>'; root.appendChild(nav);
    const prevBtn=nav.querySelector('[data-prev]'); const nextBtn=nav.querySelector('[data-next]'); const counter=nav.querySelector('[data-counter]');
    let reviewRow, progress;
    if (DATA.mode==='review'){
      reviewRow=document.createElement('div'); reviewRow.className='fc-review-row'; reviewRow.innerHTML='<button class="fc-btn secondary" data-learning>Still learning</button><button class="fc-btn primary" data-known>Know it</button><button class="fc-btn ghost" data-shuffle>Shuffle</button><button class="fc-btn ghost" data-restart>Restart</button>'; root.appendChild(reviewRow);
      progress=document.createElement('div'); progress.className='fc-progress'; progress.textContent='Unseen: '+DATA.cards.length+' | Still learning: 0 | Know it: 0'; root.appendChild(progress);
    }
    const total=DATA.cards.length; let flipped=false; let index=0; let history=[0]; let order=Array.from(DATA.cards.keys()); const status=DATA.cards.map(()=> 'unseen');
    function updateCounter(){ counter.textContent='Card '+(index+1)+' of '+total; }
    function setCard(i){ index=i; flipped=false; card.classList.remove('flipped'); frontEl.innerHTML=safeMultiline(DATA.cards[i].front||''); backEl.innerHTML=safeMultiline(DATA.cards[i].back||''); updateCounter(); }
    function flip(){ flipped=!flipped; card.classList.toggle('flipped', flipped); }
    function nextPractice(){ const pos=order.indexOf(index); const nextPos=(pos+1)%total; setCard(order[nextPos]); }
    function prevPractice(){ const pos=order.indexOf(index); const prevPos=(pos-1+total)%total; setCard(order[prevPos]); }
    function weightedNextReview(){ const w=status.map(s=>s==='learning'?3:(s==='unseen'?2:0.8)); let sum=w.reduce((a,b)=>a+b,0); if(!sum){for(let i=0;i<w.length;i++) w[i]=1; sum=w.length;} let pick=Math.random()*sum, chosen=0; for(let i=0;i<w.length;i++){ pick-=w[i]; if(pick<=0){ chosen=i; break; } } if(total>1 && chosen===index){ const cands=order.filter(i=>i!==index); chosen=cands[Math.floor(Math.random()*cands.length)]; } return chosen; }
    function applyProgress(){ if (DATA.mode!=='review') return; const counts=status.reduce((acc,s)=>(acc[s]++,acc),{unseen:0,learning:0,known:0}); progress.textContent='Unseen: '+counts.unseen+' | Still learning: '+counts.learning+' | Know it: '+counts.known; if (counts.known===total){ card.style.display='none'; nav.style.display='none'; reviewRow.style.display='none'; progress.style.display='none'; complete.style.display='block'; } else { card.style.display=''; nav.style.display=''; reviewRow.style.display=''; progress.style.display=''; complete.style.display='none'; } }
    function markLearning(){ if (DATA.mode!=='review') return; status[index]='learning'; applyProgress(); }
    function markKnown(){ if (DATA.mode!=='review') return; status[index]='known'; applyProgress(); }
    function shuffleOrder(){ for (let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; } history=[index]; }
    function restart(){ for (let i=0;i<status.length;i++) status[i]='unseen'; history=[ order[0] || 0 ]; setCard(order[0] || 0); applyProgress(); }
    card.addEventListener('click', flip);
    card.addEventListener('keydown', e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } });
    prevBtn.addEventListener('click', ()=>{ if (DATA.mode==='practice'){ prevPractice(); } else { if (history.length>1){ history.pop(); setCard(history[history.length-1]); } else { const pos=order.indexOf(index); const prev=order[(pos-1+total)%total]; setCard(prev); history.push(prev); } } });
    nextBtn.addEventListener('click', ()=>{ if (DATA.mode==='practice'){ nextPractice(); } else { const nxt=weightedNextReview(); setCard(nxt); history.push(nxt); } });
    if (DATA.mode==='review'){ reviewRow.querySelector('[data-learning]').addEventListener('click', markLearning); reviewRow.querySelector('[data-known]').addEventListener('click', markKnown); reviewRow.querySelector('[data-shuffle]').addEventListener('click', shuffleOrder); reviewRow.querySelectorAll('[data-restart]').forEach(btn=>btn.addEventListener('click', restart)); complete.querySelector('[data-restart]').addEventListener('click', restart); }
    document.addEventListener('keydown', onKeyNav); function onKeyNav(e){ if (!root.isConnected){ document.removeEventListener('keydown', onKeyNav); return; } if (e.key==='ArrowRight'){ nextBtn.click(); } else if (e.key==='ArrowLeft'){ prevBtn.click(); } else if (e.key.toLowerCase()==='f'){ flip(); } }
    setCard(0); applyProgress();
  }
  build();
})();
</script>
<!-- /Flashcards -->
