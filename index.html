
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Flashcards (Single File)</title>
  <style>
    :root{--brand-primary:#0661aa;--brand-secondary:#5AC8DA;--brand-accent:#A9CA3F;--brand-dark:#0d3b5d;--text:#111;--surface:#fff;--radius:12px;--space:12px;--space-lg:20px}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--surface)}
    .container{max-width:880px;margin:0 auto;padding:var(--space-lg)}
    .header{display:flex;align-items:center;justify-content:space-between;gap:var(--space)}
    .brand-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:var(--brand-secondary);color:#003;font-weight:600}
    .brand-dot{width:10px;height:10px;border-radius:50%;background:var(--brand-primary)}
    .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--space)}
    .controls button,.controls label{padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff}
    .controls button.primary{background:var(--brand-primary);color:#fff;border-color:var(--brand-primary)}
    .card{position:relative;width:100%;min-height:280px;border:1px solid #e3e5e7;border-radius:var(--radius);background:#fff;padding:20px;box-shadow:0 6px 30px rgba(0,0,0,.05);margin-top:18px}
    .face[hidden]{display:none}
    .media{margin:10px 0}
    img{max-width:100%;height:auto;border-radius:8px}
    audio{width:100%;margin-top:10px}
    .nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
    .progress{font-size:.9rem;color:#333}
    :focus-visible{outline:3px solid #000;outline-offset:2px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="container">
  <header class="header" role="banner">
    <div class="brand-chip" aria-label="Brand theme"><span class="brand-dot"></span><span id="brandName">Brand</span></div>
    <div class="controls" role="toolbar" aria-label="Controls">
      <button class="primary" id="flipBtn" aria-controls="card" aria-label="Flip card (space)">Flip (Space)</button>
      <button id="prevBtn" aria-label="Previous card (Left Arrow)">Prev</button>
      <button id="nextBtn" aria-label="Next card (Right Arrow)">Next</button>
      <label><input type="checkbox" id="shuffleToggle"> Shuffle</label>
      <label><input type="checkbox" id="knownToggle"> Mark Known</label>
    </div>
  </header>

  <main role="main">
    <article id="card" class="card" role="group" aria-roledescription="flashcard" aria-label="Flashcard">
      <div id="front" class="face" aria-label="Front" tabindex="0"></div>
      <div id="back" class="face" aria-label="Back" hidden tabindex="0"></div>
    </article>
    <div class="nav">
      <div class="progress" id="progress" aria-live="polite"></div>
      <div class="mode" id="modeLabel"></div>
    </div>
    <div id="status" aria-live="polite" style="min-height:1em"></div>
  </main>

  <footer class="note" role="contentinfo" style="margin-top:20px;font-size:.85rem;color:#555">
    Tip: Space to flip, Left/Right to navigate, K to toggle Known.
  </footer>
</div>

<!-- Optional: embed a deck directly by placing JSON inside this tag.
<script id="deck" type="application/json">{"id":"embedded","title":"Demo","cards":[{"front_html":"Term","back_html":"Definition"}]}</script>
-->

<script>
(function(){
  const BRANDS = {
    aolcc:{name:'Academy of Learning College (AOLCC)',colors:{primary:'#EA7024',secondary:'#5AC8DA',accent:'#A9CA3F',dark:'#0d3b5d'}},
    ptg:{name:'Pittman Training (PTG)',colors:{primary:'#0661aa',secondary:'#a9ca48',accent:'#EA7024',dark:'#0d3b5d'}}
  };
  const qs = new URLSearchParams(location.search);
  const theme = (qs.get('theme')||'aolcc').toLowerCase();
  const mode = (qs.get('mode')||'final').toLowerCase();
  const count = parseInt(qs.get('count')||'5',10);
  const deckUrl = qs.get('deckUrl'); // URL to a JSON deck
  document.getElementById('brandName').textContent = (BRANDS[theme]||BRANDS.aolcc).name;
  applyBrand(BRANDS[theme]||BRANDS.aolcc);

  const els = {
    front: document.getElementById('front'),
    back: document.getElementById('back'),
    progress: document.getElementById('progress'),
    modeLabel: document.getElementById('modeLabel'),
    status: document.getElementById('status'),
    flipBtn: document.getElementById('flipBtn'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    shuffleToggle: document.getElementById('shuffleToggle'),
    knownToggle: document.getElementById('knownToggle'),
  };

  const state = { deck:{title:'',cards:[]}, order:[], index:0, showBack:false, known:new Set() };

  init();

  async function init(){
    // Load deck from deckUrl param or embedded <script id="deck">
    let deck;
    try{
      if(deckUrl){ deck = await (await fetch(deckUrl)).json(); }
      else{
        const tag = document.getElementById('deck');
        if(tag) deck = JSON.parse(tag.textContent);
      }
    }catch(e){ console.warn('Deck load failed', e); }
    if(!deck){
      deck = {id:'sample', title:'Sample Deck', cards:[
        {front_html:'What is the capital of Canada?', back_html:'Ottawa.'},
        {front_html:'Define photosynthesis.', back_html:'Plants convert light, CO₂, and water to sugars and O₂.'}
      ]};
    }
    state.deck = deck;

    const key = storageKey(deck.id||'deck', mode);
    const saved = JSON.parse(localStorage.getItem(key)||'{}');
    if(saved.known) state.known = new Set(saved.known);
    if(saved.index!=null) state.index = saved.index;

    state.order = deck.cards.map((_,i)=>i);
    if(mode==='final'){
      els.modeLabel.textContent = 'Mode: Final Practice';
      els.shuffleToggle.checked = true; shuffle(state.order);
    } else {
      els.modeLabel.textContent = 'Mode: Mid-course Practice';
      els.shuffleToggle.checked = false; els.shuffleToggle.disabled = true;
      const start = state.index||0; const end = Math.min(start+count, state.order.length);
      state.order = state.order.slice(start,end);
    }

    bind(); render();
  }

  function bind(){
    els.flipBtn.onclick = ()=>flip();
    els.prevBtn.onclick = ()=>prev();
    els.nextBtn.onclick = ()=>next();
    els.shuffleToggle.onchange = ()=>{ if(mode==='final'){ if(els.shuffleToggle.checked){ shuffle(state.order);} else { state.order = state.deck.cards.map((_,i)=>i);} state.index=0; persist(); render(); } };
    els.knownToggle.onchange = ()=>toggleKnown();
    document.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); flip(); } else if(e.code==='ArrowRight'){ next(); } else if(e.code==='ArrowLeft'){ prev(); } else if(e.key.toLowerCase()==='k'){ toggleKnown(); } });
  }

  function render(){
    if(state.order.length===0){ els.front.innerHTML='<p>No cards in this selection.</p>'; els.back.innerHTML=''; els.progress.textContent=''; return; }
    const idx = Math.max(0, Math.min(state.index, state.order.length-1));
    state.index = idx; const cardIdx = state.order[idx]; const card = state.deck.cards[cardIdx]||{};
    els.front.innerHTML = sanitize(card.front_html||'');
    els.back.innerHTML = sanitize(card.back_html||'');
    els.front.hidden = state.showBack; els.back.hidden = !state.showBack;
    els.knownToggle.checked = state.known.has(cardIdx);
    els.progress.textContent = (idx+1)+' / '+state.order.length;
  }

  function flip(){ state.showBack = !state.showBack; render(); }
  function next(){
    if(state.index < state.order.length-1){ state.index++; state.showBack=false; }
    else if(mode==='final'){
      const unknown = state.order.filter(i=>!state.known.has(i));
      if(unknown.length){ state.order = unknown; state.index=0; els.status.textContent='Revisiting unknown cards…'; }
      else els.status.textContent='All cards marked known. Great work!';
    } else {
      els.status.textContent='Nice! Done with this practice slice.';
      const globalKey = storageKey(state.deck.id||'deck','midcourse');
      const saved = JSON.parse(localStorage.getItem(globalKey)||'{}');
      const nextStart = (saved.index||0) + state.order.length;
      localStorage.setItem(globalKey, JSON.stringify({index: Math.min(nextStart, state.deck.cards.length), known:[...state.known]}));
    }
    persist(); render();
  }
  function prev(){ if(state.index>0){ state.index--; state.showBack=false; persist(); render(); } }
  function toggleKnown(){ const i = state.order[state.index]; if(state.known.has(i)) state.known.delete(i); else state.known.add(i); els.status.textContent = state.known.has(i)?'Marked as Known':'Marked as Unknown'; persist(); }

  function persist(){ const key = storageKey(state.deck.id||'deck', mode); localStorage.setItem(key, JSON.stringify({index:state.index, known:[...state.known]})); }
  function storageKey(deck,mode){ return 'flashcards::'+deck+'::'+mode; }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

  function sanitize(html){
    if(!html) return '';
    const allowedTags = new Set(['b','strong','i','em','u','p','br','ul','ol','li','span','div','code','pre','table','thead','tbody','tr','th','td','img','audio']);
    const allowedAttrs = {img:new Set(['src','alt','title']), audio:new Set(['src','controls','aria-label','title']), '*':new Set(['role','aria-label','aria-describedby','aria-hidden'])};
    const doc = new DOMParser().parseFromString('<div>'+html+'</div>', 'text/html');
    const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_ELEMENT);
    const purge=[]; let node;
    while(node=walker.nextNode()){
      const tag = node.tagName.toLowerCase();
      if(!allowedTags.has(tag)){ purge.push(node); continue; }
      [...node.attributes].forEach(a=>{ const n=a.name.toLowerCase(); if(!(allowedAttrs['*'].has(n) || (allowedAttrs[tag]&&allowedAttrs[tag].has(n)))) node.removeAttribute(a.name); });
      if(tag==='img'||tag==='audio'){
        const src=node.getAttribute('src')||'';
        if(!(src.startsWith('https://')||src.startsWith('./')||src.startsWith('../'))) node.remove();
        if(tag==='audio'&&!node.hasAttribute('controls')) node.setAttribute('controls','');
      }
    }
    purge.forEach(n=>n.replaceWith(...n.childNodes));
    return doc.body.firstElementChild.innerHTML;
  }

  function applyBrand(brand){
    const r = document.documentElement.style;
    r.setProperty('--brand-primary', brand.colors.primary);
    r.setProperty('--brand-secondary', brand.colors.secondary);
    r.setProperty('--brand-accent', brand.colors.accent);
    r.setProperty('--brand-dark', brand.colors.dark);
  }
})();
</script>
</body>
</html>
